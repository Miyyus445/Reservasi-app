<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reservasi Event</title>
    <link rel="stylesheet" href="reservasi-app.css">
</head>

<body>
    <div class="container">

        <!-- Card Form -->
        <div class="card">
            <div class="card-header">
                <span>From Pendaftaran</span>
                <span class="total-badge" id="total-badge">Jumlah Peserta: 0</span>
            </div>

            <form id="form-reservasi">
                <div class="form-group">
                    <label for="nama">Nama Lengkap:</label>
                    <input type="text" id="nama" placeholder="Masukkan nama lengkap" autofocus />
                </div>

                <div class="form-group">
                    <label for="email">Email:</label>
                    <input type="email" id="email" placeholder="...@gmail.com" />
                </div>

                <div class="form-group">
                    <label for="event">Pilihan Event:</label>
                    <select name="event" id="event">
                        <option value="">-- Pilih Event --</option>
                        <option value="JavaScript Workshop">JavaScript Workshop</option>
                        <option value="Web Development">Web Development</option>
                        <option value="UI/UX Design">UI/UX Design</option>
                    </select>
                </div>

                <div class="button-group">
                    <button type="submit" class="btn btn-primary">Daftar Sekarang</button>
                    <button type="button" id="reset-btn" class="btn btn-secondary">Reset</button>
                </div>

                <div id="form-notification" class="form-notification"></div>
            </form>
        </div>

        <!-- Card Daftar Peserta -->
        <div class="card">
            <div class="card-header">
                <span>Daftar Peserta</span>
                <button type="button" id="clear-all-btn" class="btn btn-danger">Hapus Semua</button>
            </div>

            <div id="participant-list-container">
                <p class="empty-message">Belum ada peserta yang mendaftar</p>
            </div>
        </div>
    </div>
    <script src="./reservasi-app.js"></script>
</body>

</html>
